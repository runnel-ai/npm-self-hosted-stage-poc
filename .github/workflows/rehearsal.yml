name: Seven-package staged-publishing rehearsal

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'pack is local only; stage uploads for human review (probes main-first); verify runs after all approvals'
        type: choice
        options:
          - pack
          - stage
          - verify
        default: pack
        required: true
      version:
        description: 'Rehearsal version shared by all seven packages (e.g. 0.1.0)'
        type: string
        default: '0.1.0'
        required: true
      expected_main_integrity:
        description: 'verify only, optional: sha512-... of the main package copied from the original stage manifest'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: npm-rehearsal-${{ github.repository }}
  cancel-in-progress: false

jobs:
  rehearsal:
    if: ${{ vars.POC_RUNNER_GROUP != '' }}
    runs-on:
      group: ${{ vars.POC_RUNNER_GROUP }}
      labels: ${{ fromJSON(vars.POC_RUNNER_LABELS || '["self-hosted","linux","x64"]') }}
    timeout-minutes: 15
    container:
      image: ${{ vars.POC_NODE_IMAGE || 'node:24.21.0-bookworm-slim' }}
      options: --cpus=1 --memory=512m
    defaults:
      run:
        shell: sh
    env:
      POC_REHEARSAL_SCOPE: ${{ vars.POC_REHEARSAL_SCOPE || '@airport233' }}
      POC_VERSION: ${{ inputs.version }}
      POC_NODE_IMAGE: ${{ vars.POC_NODE_IMAGE || 'node:24.21.0-bookworm-slim' }}
    steps:
      - name: Check out the rehearsal repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check local contracts without installing dependencies
        run: node --test

      - name: Pack the seven rehearsal packages without credentials
        if: ${{ inputs.mode != 'verify' }}
        run: node rehearsal/scripts/rehearsal.mjs pack

      - name: Stage packages for human review (main-first probe)
        if: ${{ inputs.mode == 'stage' }}
        env:
          NPM_STAGE_TOKEN: ${{ secrets.NPM_STAGE_TOKEN }}
        run: node rehearsal/scripts/rehearsal.mjs stage

      - name: Verify the approved packages from a clean consumer directory
        if: ${{ inputs.mode == 'verify' }}
        env:
          POC_EXPECTED_MAIN_INTEGRITY: ${{ inputs.expected_main_integrity }}
        run: node rehearsal/scripts/rehearsal.mjs verify

      - name: Save the tarballs and non-secret evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-rehearsal-${{ github.run_id }}-${{ github.run_attempt }}
          path: rehearsal/out/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
